<style>

n:hover{filter:brightness(.975)}.btn:focus-visible{outline:3px solid #428cc4;outline-offset:2px}.btn.blue{background:linear-gradient(110deg,#d5e9ff,#c4e5fa)}.btn.pink{background:linear-gradient(110deg,#ffe2e6,#f7cfdb)}.btn.lilac{background:linear-gradient(110deg,#e5dfff,#d9d9f9)}.btn.mint{background:linear-gradient(110deg,#d5f6ee,#c8ebde)}.btn.yellow{background:linear-gradient(110deg,#fff3c6,#fff8dc)}.btn.green{background:linear-gradient(110deg,#d7f9d6,#c5efcf)}.btn.purple{background:linear-gradient(110deg,#e9e0fa,#d8dafa)}.btn.coral{background:linear-gradient(110deg,#fbe0dc,#ffd5df)}.btn:disabled{opacity:.5;cursor:default}.footer{flex:none;background:#f6fbfd;padding:10px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #c2d9e2}.foot-pill{border-radius:30px;background:white;border:1px solid #dbe5ed;color:#708b9b;display:flex;justify-content:center;gap:8px;align-items:center;min-height:38px;font-size:12px}.art{height:174px;border-radius:13px;position:relative;overflow:hidden;margin:-2px -3px 13px;background:linear-gradient(130deg,#d9d3fb,#e7bcd7 48%,#f8d8c1)}.art:before{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff80;border-radius:50%;left:-38px;top:-73px}.art:after{content:"✦  ✧   ✦";position:absolute;right:12px;top:11px;color:#fff8;font-size:22px}.art .device{position:absolute;left:26%;top:31%;width:47%;height:46%;border-radius:8px;background:#354665;border:5px solid #394664;box-shadow:0 11px 0 -5px #e7ebf7,0 15px 20px #55518c50;transform:rotate(-5deg);display:grid;place-items:center;font-size:42px}.art .device:before{content:"";position:absolute;inset:4px;background:linear-gradient(135deg,#8cc3ec,#b7a5e5,#f6b9a7);border-radius:2px}.art .device span{position:relative;z-index:1}.art .tile{position:absolute;background:#ffffffdd;border-radius:8px;padding:10px;box-shadow:0 7px 18px #6e62994a;font-size:23px}.art .t1{top:14%;left:8%;transform:rotate(-11deg)}.art .t2{top:12%;right:12%;transform:rotate(10deg)}.art .t3{bottom:10%;left:9%;transform:rotate(8deg)}.art .t4{bottom:12%;right:7%;transform:rotate(-9deg)}.art.a1{background:linear-gradient(125deg,#a8d7f0,#c6b7f4,#ffd3c5)}.art.a2{background:linear-gradient(125deg,#ffc3d0,#e2c8f6,#b6e8e6)}.art.a3{background:linear-gradient(125deg,#d4d5fa,#b9e5e6,#ffe2bd)}.art.a4{background:linear-gradient(125deg,#ffdbb5,#f4c7db,#b6d6f3)}.art.a5{background:linear-gradient(125deg,#b7e8df,#d3d2fb,#ffd8df)}.art.a6{background:linear-gradient(125deg,#f7d4d7,#f7e7ba,#b5d9f1)}.art.a7{background:linear-gradient(125deg,#d2c7f9,#f9c7cb,#b6e4ee)}.art.a8{background:linear-gradient(125deg,#bad5f9,#d5c5ef,#c6f2d9)}.art.a9{background:linear-gradient(125deg,#ffd6bb,#f8c9e3,#c6d7f5)}.art.a10{background:linear-gradient(125deg,#bfe9ec,#d9c4f8,#ffe1bf)}.art-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#ffffffc9;color:#526386;border-radius:15px;padding:3px 11px;font-size:10px;white-space:nowrap}.bullets{padding:0;margin:9px 0 0;list-style:none}.bullets li{padding:0 0 9px 25px;position:relative}.bullets li:before{content:"✓";position:absolute;left:0;top:1px;background:#8f9fd4;color:white;width:16px;height:16px;line-height:16px;text-align:center;border-radius:5px;font-size:12px}.topic-title{font-weight:800;font-size:16px;line-height:1.35;margin-bottom:12px}.problem-title{font-weight:800;font-size:15px;margin-bottom:8px}.note{font-size:12px;color:#5b7480}.disabled{pointer-events:none;opacity:.5}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(min-width:650px){body{padding:15px}.shell{height:calc(100dvh - 30px);border:5px solid #fff;border-radius:30px;overflow:hidden}.header{border-radius:22px 22px 0 0}}@media(max-width:360px){.chat{padding:10px 8px}.bubble{font-size:13px}.head-title{font-size:12px}.art{height:145px}}

<script>
const topics=[
{title:"✍️ Написание постов и ведение соцсетей",icons:["🗓️","✍️","💬","💡"],problem:"Вы знаете, о чём хотите рассказать подписчикам, но садитесь за пост - и начинается...\n\nКак написать? С чего начать? Какой заголовок придумать?\n\nА ещё нужны сторис, публикации на следующую неделю и идеи на месяц вперёд.",tasks:["Придумать темы постов на неделю или месяц.","Составить готовый план публикаций.","Написать черновик поста по вашей идее.","Придумать интересные заголовки.","Подготовить тексты для сторис.","Переделать один материал для Telegram, MAX и других соцсетей.","Подстроить тексты под вашу манеру общения."],benefit:"Вам больше не нужно часами сидеть перед пустым экраном, мучительно придумывать темы и переживать, что в канале снова неделю ничего не публиковалось.\n\nНейросеть возьмёт на себя значительную часть подготовки: от идей до черновиков готовых публикаций.\n\nА значит, можно сократить расходы на копирайтера и контент-менеджера, а при небольшом объёме работы - попробовать обойтись без их постоянных услуг."},
{title:"🎨 Создание красивых картинок и видео",icons:["🎨","🖼️","🎬","✨"],problem:"Хотите, чтобы ваши соцсети выглядели красиво, но не готовы постоянно платить дизайнеру, фотографу или монтажёру?\n\nИ уж тем более не хотите каждый день снимать себя на камеру?",tasks:["Создавать картинки для постов по вашему описанию.","Делать обложки и красивые подборки из нескольких слайдов.","Подбирать единые цвета и оформление для канала.","Создавать изображения с вашим участием на основе ваших фотографий и с вашего согласия.","Оживлять фотографии и рисунки.","Делать короткие ролики, в которых вам необязательно появляться лично.","Предлагать идеи оформления для разных публикаций."],benefit:"Необязательно тратить несколько вечеров на поиск подходящих фотографий, осваивать сложные редакторы или постоянно снимать себя на камеру.\n\nС нейросетями можно самостоятельно создавать красивые обложки, картинки, короткие видео и оформление для соцсетей.\n\nИ самое приятное - не придётся каждый раз обращаться к дизайнеру, фотографу или монтажёру и оплачивать даже небольшие изменения."},
{title:"📄 Подготовка анкет, тестов и упражнений",icons:["📄","📋","📚","✏️"],problem:"Консультации закончились, а работа продолжается?\n\nНужно подготовить анкету, найти подходящее упражнение, оформить вопросы для группы или составить материал для самостоятельной работы клиента.",tasks:["Подготовить черновик анкеты под вашу задачу.","Предложить варианты вопросов.","Помочь оформить известную методику в удобный рабочий формат с соблюдением авторских прав.","Составить план группового занятия.","Предложить идеи упражнений, которые вы сможете оценить и доработать.","Превратить ваши записи в аккуратный документ.","Найти профессиональные статьи и подготовить краткий пересказ с источниками для проверки.","Подготовить материал для распечатки."],benefit:"Больше не нужно каждый раз начинать с чистого листа, часами собирать вопросы, перепечатывать материалы и самостоятельно заниматься оформлением.\n\nНейросеть подготовит основу, а вы проверите её, внесёте необходимые изменения и адаптируете под свою профессиональную задачу.\n\nЭто сокращает время на подготовку и позволяет часть технической работы выполнять без привлечения платного помощника или специалиста по оформлению документов. Профессиональный выбор методик остаётся за вами."},
{title:"📣 Продвижение и привлечение клиентов",icons:["📣","📈","💬","🌟"],problem:"Вы хороший специалист, но потенциальные клиенты об этом пока не знают?\n\nВсе советуют разное: ведите соцсети, покупайте рекламу, создавайте сайт, записывайте видео...\n\nА за что хвататься в первую очередь?",tasks:["Предложить способы продвижения под вашу специализацию и возможности.","Помочь составить понятный план действий.","Подготовить описание ваших услуг.","Написать черновики объявлений и рекламных текстов.","Помочь с содержанием сайта или страницы психолога.","Предложить идеи бесплатных способов привлечения внимания.","Помочь разобраться в результатах уже проведённого продвижения."],benefit:"Вместо бесконечных попыток разобраться, где и как себя рекламировать, вы сможете составить понятный план продвижения с учётом своей специализации и бюджета.\n\nНейросеть поможет подготовить тексты, объявления и описания услуг, за которые раньше пришлось бы отдельно платить копирайтеру или маркетологу.\n\nМеньше хаотичных действий, лишних расходов и переживаний из-за того, что вы снова вложили деньги в продвижение, не понимая, зачем и что делать дальше."},
{title:"🔎 Изучение проблем и запросов клиентов",icons:["🔎","💬","🗒️","💡"],problem:"Бывает, что вы пишете полезные профессиональные тексты, а подписчики почти не реагируют?\n\nВозможно, дело не в содержании. Просто люди описывают свои проблемы совсем другими словами.\n\nНапример, вместо «эмоциональное выгорание» человек говорит: «Я просыпаюсь уже уставшей».",tasks:["Найти открытые обсуждения по интересующей теме.","Собрать часто встречающиеся вопросы.","Выделить проблемы, страхи и сомнения людей.","Показать, какими словами они описывают свои переживания.","Предложить темы постов на основе этих вопросов.","Помочь подготовить опрос для подписчиков.","Разобрать ответы из опроса и выделить повторяющиеся темы."],benefit:"Вам не придётся самостоятельно перечитывать десятки обсуждений, собирать вопросы по разным форумам и гадать, какие темы действительно интересуют людей.\n\nНейросеть поможет быстрее собрать информацию, выделить повторяющиеся проблемы и найти идеи для публикаций.\n\nДля первичного изучения аудитории необязательно сразу заказывать дорогостоящее исследование у маркетолога. Часть работы можно выполнить самостоятельно, не загружая в нейросеть конфиденциальные истории клиентов."},
{title:"✨ Яркое представление себя и своих услуг",icons:["✨","🖼️","🎨","🌸"],problem:"У вас есть образование, опыт, специализация. Но как рассказать об этом так, чтобы человек понял, почему ему стоит обратиться именно к вам?\n\nОсобенно когда вокруг столько психологов, а писать о себе «я профессионал с индивидуальным подходом» совсем не хочется.",tasks:["Помочь найти ваши сильные профессиональные стороны.","Подсказать, как просто рассказать о своей специализации.","Подготовить несколько вариантов представления себя.","Помочь оформить описание профиля и канала.","Предложить идеи единого оформления публикаций.","Подобрать сочетания цветов и шрифтов.","Помочь придумать запоминающееся название для проекта.","Составить понятное описание консультаций и других услуг."],benefit:"Не нужно неделями мучиться над описанием себя, бесконечно переписывать шапку профиля или платить нескольким специалистам, чтобы они придумали, как вас красиво представить.\n\nНейросеть поможет найти ваши сильные стороны, подобрать понятные слова и предложить идеи оформления.\n\nВы сможете сократить расходы на услуги копирайтера, дизайнера и специалиста по личному бренду, а главное - перестать переживать, что у других психологов всё выглядит красиво, а вы никак не можете рассказать о себе."},
{title:"🎤 Подготовка к эфирам и выступлениям",icons:["🎤","📊","🗒️","✨"],problem:"Вас пригласили провести эфир, выступить на мероприятии или подготовить небольшой мастер-класс?\n\nТему вы знаете прекрасно. Но теперь нужно придумать интересное начало, собрать материал, уложиться во время и оформить презентацию.",tasks:["Составить план выступления.","Придумать интересное начало.","Разделить большую тему на понятные части.","Подготовить текст для презентации.","Предложить вопросы для зрителей и возможные ответы на них.","Придумать примеры, чтобы объяснить сложное простыми словами.","Подготовить краткие заметки для выступления.","Составить анонс эфира для соцсетей."],benefit:"Вместо нескольких вечеров за подготовкой презентации, поиском примеров и составлением плана вы сможете получить основу гораздо быстрее.\n\nНеобязательно отдельно оплачивать услуги дизайнера презентаций, редактора или помощника для подготовки материалов.\n\nА когда перед вами уже есть понятная структура выступления, гораздо спокойнее готовиться к эфиру. Остаётся сосредоточиться на том, что вы действительно умеете, - делиться своими знаниями и опытом."},
{title:"🤖 Найм эффективных сотрудников без оплаты",icons:["💻","🗓️","📝","⚙️"],problem:"Представьте, что у вас появилась небольшая команда.\n\nОдин сотрудник придумывает темы постов. Второй готовит тексты. Третий предлагает идеи оформления. Четвёртый собирает информацию по нужной теме.\n\nИ каждому не приходится заново объяснять, чем вы занимаетесь и как любите работать.",tasks:["Создать помощника для ведения соцсетей.","Настроить редактора, который проверяет и улучшает ваши тексты.","Сделать помощника по поиску профессиональной информации.","Создать организатора, который составляет планы и списки задач.","Настроить помощника для подготовки выступлений.","Сделать генератор идей для новых проектов.","Заранее объяснить каждому его задачу и правила работы."],benefit:"Представьте, что вам больше не приходится выполнять абсолютно всё самостоятельно.\n\nВиртуальные помощники могут готовить черновики постов, придумывать идеи, редактировать тексты, собирать информацию и составлять планы.\n\nИм не нужно платить зарплату. Для их работы может понадобиться подписка на нейросервис, но это может быть дешевле постоянного найма нескольких специалистов для небольших повторяющихся задач.\n\nМеньше рутины, меньше расходов на отдельных исполнителей и больше возможностей заниматься самой психологией. Итоговую работу проверяете вы."},
{title:"📚 Разработка памяток и полезных подборок",icons:["📚","📑","🎁","🖊️"],problem:"Хотите иногда радовать подписчиков чем-то полезнее обычного поста?\n\nНапример, небольшой памяткой «5 способов справиться с волнением перед выступлением» или подборкой упражнений для самостоятельной работы.\n\nНо пока придумаешь содержание, напишешь текст и красиво всё оформишь - проходит несколько часов.",tasks:["Предложить темы полезных материалов.","Помочь составить содержание.","Подготовить понятный черновик текста.","Разделить информацию на небольшие блоки.","Сделать список рекомендаций или пошаговую инструкцию.","Помочь оформить материал в PDF.","Подготовить текст для страницы, на которой подписчик сможет получить ваш подарок."],benefit:"Вы сможете быстрее создавать полезные подарки для подписчиков: памятки, небольшие инструкции, подборки советов и упражнений.\n\nНе придётся тратить несколько дней на каждый материал или отдельно оплачивать работу копирайтера и дизайнера.\n\nА значит, у вас появится возможность чаще радовать аудиторию полезными материалами, привлекать внимание к своему каналу и при этом не превращать продвижение в ещё одну полноценную работу."},

const chat=document.querySelector("#chat");let locked=false;let generation=0;
function now(){return new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function scrollEnd(){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"}))}
function bubble(text,kind="bot"){let el=document.createElement("article");el.className="bubble "+(kind==="user"?"user":"");let body=document.createElement("div");body.textContent=text;el.append(body);let time=document.createElement("div");time.className="time";time.textContent=now()+(kind==="user"?" ✓✓":"");el.append(time);chat.append(el);scrollEnd();return el}
function buttons(items){let wrap=document.createElement("div");wrap.className="actions";items.forEach((it,i)=>{let b=document.createElement("button");b.className="btn "+(it.color||["blue","pink","lilac","coral","mint","yellow","purple","blue","pink","green"][i%10]);b.textContent=it.label;b.addEventListener("click",()=>{if(locked)return;wrap.remove();it.run()});wrap.append(b)});chat.append(wrap);scrollEnd()}
function user(text){bubble(text,"user")}
function art(topic,i){let a=document.createElement("div");a.className="art a"+(i+1);a.setAttribute("role","img");a.setAttribute("aria-label","Декоративная иллюстрация к теме "+topic.title);let device=document.createElement("div");device.className="device";let d=document.createElement("span");d.textContent=topic.icons[0];device.append(d);a.append(device);topic.icons.slice(0,4).forEach((icon,j)=>{let x=document.createElement("span");x.className="tile t"+(j+1);x.textContent=icon;a.append(x)});let label=document.createElement("div");label.className="art-label";label.textContent="✦ идеи • нейросети • творчество ✦";a.append(label);return a}
function start(){generation++;locked=false;chat.replaceChildren();bubble("Привет! Я покажу, какие задачи психолог может облегчить с помощью нейросетей, чтобы оставалось больше времени на клиентов, развитие практики и собственную жизнь.");question();menu()}
function question(){let el=bubble("Что бы вы хотели облегчить в своей работе прямо сейчас?");el.classList.add("question")}
function menu(){buttons(topics.map((t,i)=>({label:t.title,run:()=>openTopic(i)})))}
function home(){generation++;locked=false;chat.replaceChildren();question();menu()}
function openTopic(i){let t=topics[i];generation++;chat.replaceChildren();let el=bubble("");el.firstChild.remove();el.insertBefore(art(t,i),el.firstChild);let h=document.createElement("div");h.className="topic-title";h.textContent=t.title;let sh=document.createElement("div");sh.className="problem-title";sh.textContent="Знакомая ситуация?";let txt=document.createElement("div");txt.textContent=t.problem;el.insertBefore(h,el.lastChild);el.insertBefore(sh,el.lastChild);el.insertBefore(txt,el.lastChild);scrollEnd();let completed={tasks:false,benefit:false};function options(){let a=[];if(!completed.tasks)a.push({label:"Что можно поручить нейросети?",color:"blue",run:()=>{completed.tasks=true;showTasks(i);options()}});if(!completed.benefit)a.push({label:"В чём моя выгода?",color:"pink",run:()=>{completed.benefit=true;showBenefit(i);options()}});if(completed.tasks&&completed.benefit)nav();else buttons(a)}options()}
function showTasks(i){let el=bubble("");el.firstChild.remove();let h=document.createElement("strong");h.textContent="Нейросеть может:";el.insertBefore(h,el.lastChild);let ul=document.createElement("ul");ul.className="bullets";topics[i].tasks.forEach(t=>{let li=document.createElement("li");li.textContent=t;ul.append(li)});el.insertBefore(ul,el.lastChild);scrollEnd()}
function showBenefit(i){let text=topics[i].benefit;let el=bubble("");el.firstChild.remove();let h=document.createElement("div");h.className="benefit-heading";h.textContent="✨ В чём моя выгода?";el.insertBefore(h,el.lastChild);let parts=text.split(/\n\n/).filter(Boolean);let icons=["⏳","💰","🌿","✨"];parts.forEach((part,j)=>{let row=document.createElement("div");row.className="benefit-row";let badge=document.createElement("span");badge.className="benefit-icon";badge.textContent=icons[j%icons.length];let body=document.createElement("span");body.textContent=part;row.append(badge,body);el.insertBefore(row,el.lastChild)});scrollEnd()}
function nav(){buttons([{label:"🔙 Вернуться ко всем возможностям",run:home},{label:"💬 Задать вопрос Марии",color:"pink",run:contact},{label:"📲 Перейти в канал Марии",color:"mint",run:channel}])}
function choice(message,telegram,max){chat.replaceChildren();bubble(message);let wrap=document.createElement("div");wrap.className="actions";[{label:"Telegram",url:telegram,color:"blue"},{label:"MAX",url:max,color:"mint"}].forEach(it=>{let link=document.createElement("a");link.className="btn "+it.color;link.textContent=it.label;link.href=it.url;link.target="_blank";link.rel="noopener noreferrer";link.style.display="grid";link.style.placeItems="center";link.style.textDecoration="none";wrap.append(link)});let back=document.createElement("button");back.className="btn lilac";back.textContent="🔙 Вернуться ко всем возможностям";back.addEventListener("click",home);wrap.append(back);chat.append(wrap);scrollEnd()}

function contact(){choice("Где вам удобнее задать мне вопрос?","https://t.me/maria_vadimovna_psy","https://6max.ru/mariakoreneva")}
function channel(){choice("Где вам удобнее читать мой канал?","https://t.me/mariakoreneva_ai_psy","https://max.ru/channel_mariakoreneva_ai_psy")}

start();
</script></body></html>
